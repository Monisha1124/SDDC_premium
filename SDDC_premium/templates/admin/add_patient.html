<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient | SDDC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .back-btn {
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #0d4f82;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>➕ Add Patient</h1>

        <a href="{{ url_for('admin_patients') }}" class="back-btn">
            ← Back
        </a>
    </div>

    <div class="form-card">

        <form action="{{ url_for('add_patient') }}" method="POST">

            <div class="form-group">
                <label>Patient Name</label>
                <input
                    type="text"
                    name="patient_name"
                    placeholder="Enter patient name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                >
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input
                    type="date"
                    name="date_of_birth"
                >
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Address</label>

                <textarea
                    name="address"
                    placeholder="Enter patient address"
                ></textarea>
            </div>

            <div class="form-group">
                <label>Medical Notes</label>

                <textarea
                    name="medical_notes"
                    placeholder="Enter important medical notes"
                ></textarea>
            </div>

            <button type="submit" class="save-btn">
                💾 SAVE PATIENT
            </button>

        </form>

    </div>

</div>

</body>
</html>
